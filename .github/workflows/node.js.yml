# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    # Б13-повтор (26.08.2026): гейт Dependabot больше не заводит СВОЙ прогон на
    # каждый коммит PR (8 прогонов за 7 суток, 8 из них `skipped`,
    # веток dependabot/* — 0). Он стал работой внутри этого прогона. Шаги,
    # раннер и условие не изменились — сменилась единица учёта.
    dependency-review:
        name: Dependency Review Gate
        if: github.event_name == 'pull_request'
        uses: ./.github/workflows/dependency-review-gate.yml
        permissions:
            contents: read
            pull-requests: read
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: create env file
              run: |
                  touch .env
                  echo TOKEN=${{ secrets.TOKEN }} >> .env
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm test

    # ⚠ ЗАДАНИЕ `notify-hub` УДАЛЕНО 14.08.2026, И ЭТО НЕ ПОТЕРЯ ФУНКЦИИ.
    #
    # Оно не отработало НИ РАЗУ: 0 успешных прогонов из 13 в истории. Две
    # причины, каждой достаточно:
    #
    #   1. `secrets.TECHCON_HUB_DISPATCH_TOKEN` — секрет уровня организации с
    #      видимостью «только приватные репозитории», а этот репозиторий
    #      публичный. Значение приезжало пустым, то есть диспатч ушёл бы под
    #      пустым токеном даже при исправном действии.
    #   2. Пин `actions/github-script@60a0d83…` указывает на несуществующий
    #      коммит — прогон падал с `Unable to resolve action`.
    #
    # Свежесть состояния этого репозитория у хаба и так есть: суточный слепок
    # `techcon_hub/scripts/repo_state.py` опрашивает все репозитории
    # организации через REST и с 14.08 публикует их здоровье метриками
    # (`repo_ci_health`). Диспатч дублировал бы этот путь — и, в отличие от
    # него, не работал.
