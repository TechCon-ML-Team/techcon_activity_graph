# Ручной ревью для Dependabot PR.
# Dependabot продолжает открывать PR (видимость устаревших зависимостей сохраняется),
# но авто-мерджа нет и не будет: любой dependency-bump PR обязан пройти явную
# верификацию человеком — этот джоб падает, пока на PR не поставлен лейбл
# 'manually-verified'. См. cluster K2, quality wave 2026-07-07.
name: Dependency review gate

# Б13-повтор (26.08.2026): ЭТОТ ВОРКФЛОУ БОЛЬШЕ НЕ ТРИГГЕРИТСЯ НА КОММИТ.
#
# Живой замер по организации за 7 суток (GitHub REST API, перечислены ВСЕ
# прогоны окна): 216 из 977 прогонов `pull_request` завершились `skipped` —
# и все 216 это данный гейт в девяти репозиториях. В techcon_activity_graph он дал
# 8 прогонов, из них 8 `skipped`, веток `dependabot/*` за окно 0.
# То есть каждый PR заводил отдельный прогон, чья единственная работа
# немедленно отсеивалась условием `startsWith(..., 'dependabot/')` ниже.
#
# Условие отсева стоит на уровне РАБОТЫ, и перенести его на уровень триггера
# нельзя: `on.pull_request.branches` фильтрует БАЗОВУЮ ветку, фильтра по
# head-ветке у GitHub нет. Единственный способ не заводить отдельный прогон —
# быть работой внутри чужого прогона. Отсюда `workflow_call` и работа
# `dependency-review` в `node.js.yml`.
#
# ⚠ ОХВАТ НЕ ТРОНУТ: шаги, раннер и условие те же. Триггер по МЕТКАМ оставлен
# намеренно — сообщение гейта обещает «после добавления метки проверка станет
# зелёной», и без него обещание стало бы ложным. Событие с меткой коммита не
# несёт и в веер «прогон на коммит» не входит.
#
# ⚠ Отмена устаревшего прогона (`concurrency`) этот показатель сдвинуть НЕ
# МОЖЕТ: отменённый прогон остаётся прогоном и остаётся в знаменателе.
on:
  workflow_call:
  pull_request:
    types: [labeled, unlabeled]

jobs:
    dependency-review-gate:
        name: dependency-review-gate
        runs-on: ubuntu-latest
        # Гейт применяется только к PR из веток Dependabot (dependabot/**).
        if: startsWith(github.event.pull_request.head.ref, 'dependabot/')
        steps:
            - name: Check for 'manually-verified' label
              uses: actions/github-script@60a0d83039f74a4f479b5f76fecfa5d9aca7ed73 # v7
              with:
                  script: |
                      const labels = context.payload.pull_request.labels.map(l => l.name);
                      if (!labels.includes('manually-verified')) {
                        core.setFailed(
                          "Ручной ревью обязателен: это PR от Dependabot (dependency bump). " +
                          "Авто-мерджа в этом репозитории нет — прежде чем мержить, ревьюер " +
                          "должен вручную проверить changelog/breaking changes и добавить " +
                          "лейбл 'manually-verified' на этот PR. После добавления лейбла " +
                          "перезапустите проверку (re-run) или дождитесь события 'labeled'."
                        );
                        return;
                      }
                      core.info("Лейбл 'manually-verified' найден — ручная проверка пройдена.");
