name: КАНАРЕЙКА — доступность приватного реусабла публичному вызывателю

# ВРЕМЕННЫЙ измерительный воркфлоу (06.09.2026). Задача — РАЗЛИЧИТЬ две
# конкурирующие причины, из-за которых `audience-check.yml` здесь падает с
# нулём джоб, и которые в прежних диагнозах были СМЕШАНЫ:
#
#   (A) публичный репозиторий не может вызвать reusable приватного хаба
#       (платформенный запрет — тогда прогон не резолвится вовсе);
#   (B) вызываемый воркфлоу сидит на `runs-on: vpc-runners`, а эта группа
#       несёт `allows_public_repositories: false` (тогда резолв ПРОШЁЛ, а
#       джоба просто не получает раннера).
#
# Прежнее «доказательство» запрета опиралось на audience-check-callable.yml,
# который на ОБОИХ пинах (7c05606 и 84be1896) держит `runs-on: vpc-runners` —
# то есть (A) и (B) не были разделены.
#
# Здесь взят `push-to-main-sentinel-callable.yml@84be1896`, у которого
# `runs-on: ubuntu-latest`. Конфаундер (B) снят: раннер публичному репо
# доступен. Значит исход читается однозначно:
#   * прогон с 0 джоб и `referenced_workflows: []` -> (A) подтверждена;
#   * прогон, где джоба появилась (пусть даже упала внутри) -> (A) ОПРОВЕРГНУТА.
#
# Смысл — только резолв вызова, не итог проверки: сторож ждёт контекст
# push-события, а тут pull_request, поэтому внутренняя красная джоба здесь
# считается УСПЕХОМ измерения.

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  canary:
    uses: TechCon-ML-Team/techcon_hub/.github/workflows/push-to-main-sentinel-callable.yml@84be1896e49573b8e8793ddf88d104277aced1fb
    secrets:
      hub_read_token: ${{ secrets.PEER_READ_TOKEN || secrets.GH_ORG_TOKEN || secrets.TECHCON_HUB_TOKEN }}
